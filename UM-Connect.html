</style></head><body><aside><a class="brand" href="#"><span class="crest">UM<span>✦</span></span><span>UM Connect<span class="gold">+</span><small>UNIVERSITI MALAYA</small></span></a><label class="mode-label" for="mode">YOUR WORKSPACE</label><select id="mode"><option>Student</option><option>Merchant</option><option>MPP</option></select><nav id="nav"></nav><div class="sidebar-bottom"><div class="campus"><span class="status-dot"></span> A more connected campus<p>Every cashless moment counts.</p></div><button class="profile" onclick="go('Profile & teams')"><span class="avatar">AN</span><span>Aina Nadhirah<small>Student · Faculty of Science</small></span><span>↗</span></button></div></aside><div class="shell"><header><div><span class="breadcrumb">Campus / </span><span id="crumb">Overview</span></div><div class="header-right"><span class="demo">INTERACTIVE DEMO</span><button class="icon-button" aria-label="Notifications" onclick="notifications()">♧<i></i></button><span class="avatar small">AN</span></div></header><main id="main"></main><footer><span>UM Connect+ · Built for our campus community</span><span>Powered by cashless possibilities <b>↗</b></span></footer></div><dialog id="dialog"><button class="close" onclick="this.closest('dialog').close()" aria-label="Close dialog">×</button><div id="dialog-content"></div></dialog><div id="toast" role="status"></div><script>const $=s=>document.querySelector(s);let saved;try{saved=JSON.parse(localStorage.getItem('um-connect')||'{}')}catch{saved={}}let state={points:1250,spent:86.5,donated:0,checkins:12,redeemed:[],approved:[],offers:[],...saved};let mode='Student',page='Overview',category='All',query='';const menus={Student:[['Overview','◫'],['Discover merchants','⌕'],['Rewards & missions','✧'],['My spending','▥'],['Campus community','♧'],['Learn & earn','▤'],['Profile & teams','◉']],Merchant:[['Overview','◫'],['Business onboarding','⊕'],['Cashless readiness','✓'],['Offers & marketing','✧'],['Merchant insights','▥'],['Student bazaars','♧']],MPP:[['Overview','◫'],['Verification queue','✓'],['PayNet merchant list','▤'],['Campaign manager','⚑'],['Reconciliation','⇄'],['Budget tracker','▥']]};
const merchants=[{name:'Kopi Kolej',category:'Food & drinks',location:'Kolej Kediaman 3',distance:120,offer:'2× points on your first visit',img:'photo-1442512595331-e89e73853f31',icon:'☕'}, {name:'The Daily Bowl',category:'Food & drinks',location:'Kompleks Perdanasiswa',distance:350,offer:'Earn 50 bonus points',img:'photo-1546069901-ba9599a7e63c',icon:'◒'}, {name:'Campus Print Co.',category:'Printing',location:'Faculty of Science',distance:180,offer:'10% off with 200 points',img:'photo-1499951360447-b19be8fe80f5',icon:'▤'}, {name:'Fresh Laundry',category:'Laundry',location:'UM South Gate · 80 m outside',distance:80,offer:'First-visit bonus · 30 points',img:'photo-1517677208171-0bc6725a3e60',icon:'◉'}, {name:'Varsity Essentials',category:'Shops',location:'UM North Gate · 60 m outside',distance:60,offer:'RM5 voucher · 500 points',img:'photo-1441986300917-64674bd600d8',icon:'▣'}];
function persist(){localStorage.setItem('um-connect',JSON.stringify(state))}function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').style.display='none',4000)}function modal(html){$('#dialog-content').innerHTML=html;$('#dialog').showModal()}function close(){ $('#dialog').close()}function heading(title,desc,action=''){return `<div class="page-heading"><div><div class="eyebrow">${mode==='Student'?'YOUR CAMPUS, CONNECTED':mode==='Merchant'?'GROW WITH YOUR CAMPUS':'CAMPUS OPERATIONS'}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}function btn(label,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}function section(title,action=''){return `<div class="section-head"><h2>${title}</h2>${action}</div>`}function stat(label,value,note,icon='✧',c='positive'){return `<div class="stat"><div class="stat-top">${label}<span class="stat-icon">${icon}</span></div><strong>${value}</strong><small class="${c}">${note}</small></div>`}function photo(m){return `https://images.unsplash.com/${m.img}?auto=format&fit=crop&w=600&q=80`}function merchantCard(m){return `<button class="merchant" onclick="merchantDetail('${m.name}')"><div class="merchant-image"><img src="${photo(m)}" alt="${m.category==='Printing'?'Campus workspace':m.category}" loading="lazy"><span class="badge">✓ CASHLESS READY</span></div><div class="merchant-info"><h3>${m.name}</h3><p>${m.category} · ${m.distance} m away</p><div class="offer">✧ &nbsp; ${m.offer}</div></div></button>`}function missions(){return `<div class="mission"><div class="mission-icon">↗</div><div class="mission-content"><h3>Five days, cashless ways</h3><p>Pay cashless 5 days in a row</p><div class="progress"><div style="width:60%"></div></div></div><small>3 / 5 days<br><br>+100 pts</small></div><div class="mission"><div class="mission-icon">⌕</div><div class="mission-content"><h3>A little campus exploring</h3><p>Visit 3 new merchants this week</p><div class="progress"><div style="width:33%"></div></div></div><small>1 / 3 visited<br><br>+150 pts</small></div>`}function activity(){return `<table class="activity"><thead><tr><th>MERCHANT</th><th>DATE</th><th>AMOUNT</th><th>POINTS</th></tr></thead><tbody>${(state.transactions||[{name:'Kopi Kolej',date:'Today, 10:42 am',amount:8.5,points:17},{name:'The Daily Bowl',date:'Yesterday, 1:15 pm',amount:12,points:24},{name:'Campus Print Co.',date:'20 Oct, 11:30 am',amount:6,points:12}]).map(t=>`<tr><td><span class="mini-icon">${merchants.find(m=>m.name===t.name)?.icon||'▣'}</span>${t.name}<small>Verified cashless check-in</small></td><td>${t.date}</td><td>RM ${Number(t.amount).toFixed(2)}</td><td style="color:var(--green)">+${t.points} pts</td></tr>`).join('')}</tbody></table>`}function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}$('#mode').onchange=e=>{mode=e.target.value;page='Overview';render()};function render(){ $('#nav').innerHTML=menus[mode].map(([n,i])=>`<button class="${n===page?'active':''}" onclick="go('${n}')"><span class="ni">${i}</span>${n}${n==='Rewards & missions'?'<span class="count">2</span>':''}${n==='Verification queue'?'<span class="count">3</span>':''}</button>`).join('');$('#crumb').textContent=page;$('#main').innerHTML=mode==='Student'?student():mode==='Merchant'?merchantView():mpp();}
function student(){switch(page){case'Overview':return heading('Good afternoon, Aina ☀','Find a merchant, pay cashless, then check in to earn rewards.',btn('⌗ &nbsp; Already paid? Check in',"checkin()",'primary'))+`<section class="hero"><div><div class="eyebrow">SMALL HABITS. BIG CAMPUS ENERGY.</div><h2>Your everyday spends.<br>A little more rewarding.</h2><p>Find a campus favourite → pay with DuitNow QR.<br>Then return here to check in and earn points.</p>${btn('Find a merchant &nbsp; ↗',"go('Discover merchants')",'gold-btn')}</div><div class="hero-art"><div class="card-label">UM CONNECT+ &nbsp; / &nbsp; STUDENT</div><strong>Made for<br>campus life.</strong><span class="chip">⌗</span><small>CONNECT · PAY · EARN · GIVE</small></div></section><div class="stats">${stat('Available points',state.points.toLocaleString(),'250 points expire in 12 days','✧','warning')}${stat('Spent this week',`RM ${state.spent.toFixed(2)}`,'Within your RM 150 weekly goal','▥')}${stat('Verified check-ins',state.checkins,'+3 from last week','⌗')}${stat('Your campus impact',`${state.donated+350} pts`,'Contributed to student welfare','♧')}</div><div class="dashboard-grid"><div>${section('Good things, close by',`<button class="text-btn" onclick="go('Discover merchants')">View all merchants ↗</button>`)}<div class="merchant-grid">${merchants.slice(0,3).map(merchantCard).join('')}</div><div style="height:25px"></div><section class="panel">${section('Your recent check-ins',`<button class="text-btn" onclick="go('My spending')">View activity ↗</button>`)}${activity()}</section></div><div><section class="panel">${section('This week’s missions','<span class="badge" style="background:#faf5e9;color:#a27b31">4 days left</span>')}${missions()}<button class="text-btn" style="margin-top:20px" onclick="go('Rewards & missions')">See all missions &nbsp; ↗</button></section><section class="community-card"><span class="eyebrow">A LITTLE GOES A LONG WAY</span><h3>Good for you.<br>Even better, together.</h3><p>Give your points a purpose. Support the UM Student Welfare Fund.</p><button class="text-btn" onclick="donate()">Donate points &nbsp; ↗</button><span class="flower">✺</span></section></div></div>`;
case'Discover merchants':return heading('Find your next campus favourite','Choose a merchant → pay in your banking app → return here to check in.')+`<div class="toolbar"><input class="search" placeholder="Search merchants or locations" aria-label="Search merchants" value="${query}" oninput="query=this.value;filterMerchants()">${['All','Food & drinks','Laundry','Printing','Shops'].map(c=>`<button class="pill ${category===c?'selected':''}" onclick="category='${c}';render()">${c}</button>`).join('')}</div><p class="muted">✓ MPP verified &nbsp; · &nbsp; DuitNow QR accepted &nbsp; · &nbsp; First visits earn bonus points</p><div id="merchant-results" class="merchant-grid directory">${filtered().map(merchantCard).join('')}</div>`;
case'Rewards & missions':return heading('Make every point count','Check in after paying to earn points. Choose a reward below, then use missions to plan your next visit.')+`<div class="two-col"><div class="panel"><div class="eyebrow">YOUR REWARDS BALANCE</div><div class="large-number">${state.points.toLocaleString()} <span class="muted">points</span></div><div class="notice">250 points expire on 3 November · 12 days remaining. Unused points automatically go to the student welfare pool.</div></div><div class="panel">${section('Weekly missions')}${missions()}</div></div>${section('A little something for you')}<div class="three-col">${[['☕','Kopi Kolej · RM5 voucher',500],['▤','Campus Print Co. · 10% off',200],['↗','RM2 cashback',300]].map(([i,n,p])=>`<div class="panel"><div class="reward-icon">${i}</div><h3>${n}</h3><p class="muted">${p} points · Valid for 30 days</p>${btn(state.redeemed.includes(n)?'View voucher':`Redeem · ${p} pts`,`redeem('${n}',${p})`,'primary')}</div>`).join('')}</div>${section('Your redeemed rewards')}<div class="panel">${state.redeemed.length?state.redeemed.map(n=>`<div class="listing"><span>${n}</span>${btn('View voucher',`redeem('${n}',0)`)}</div>`).join(''):'<p class="muted">Your redeemed vouchers and cashback confirmations will appear here.</p>'}</div>`;
case'My spending':return heading('A clearer picture of your spending','Built from your verified check-ins. Every small habit adds up.',btn('Edit weekly goal',"budget()"))+`<div class="stats">${stat('This week',`RM ${state.spent.toFixed(2)}`,'From verified check-ins','▥')}${stat('Weekly budget',`RM ${state.goal||150}`,'Your personal spending goal','◉')}${stat('Top category','Food & drinks','68% of weekly spending','◒')}${stat('Remaining',`RM ${Math.max(0,(state.goal||150)-state.spent).toFixed(2)}`,'Keep a little room for tomorrow','↗')}</div><div class="two-col"><div class="panel">${section('Your week, at a glance')}<div class="bar-chart">${[40,65,48,87,24,12,9].map((v,i)=>`<div style="height:${v}%"><small>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</small></div>`).join('')}</div><div class="chart-key"><span>Daily spending · RM</span><span>19–25 October</span></div></div><div class="panel"><h3>Your budget, your pace</h3><p class="muted">You have used ${Math.round(state.spent/(state.goal||150)*100)}% of your weekly goal. Consider setting aside RM 10 for tomorrow’s lunch.</p><div class="budget-line"><span>RM ${state.spent.toFixed(2)} spent</span><span>RM ${state.goal||150} goal</span></div><div class="progress"><div style="width:${Math.min(100,state.spent/(state.goal||150)*100)}%"></div></div><p class="muted">Check-in totals reflect recorded purchases, rather than your bank balance.</p></div></div><div class="panel">${section('All check-in activity')}${activity()}</div>`;
case'Campus community':return heading('Campus is better, together','Your residential college, faculty and student entrepreneurs in one place.')+`<div class="two-col"><div class="community-card"><div class="eyebrow">STUDENT WELFARE FUND</div><h3>Small points. Shared possibilities.</h3><p>Donate whenever you like. Points left at expiry automatically join the welfare pool.</p><div class="large-number">${(12450+state.donated).toLocaleString()} <span class="muted">points raised</span></div>${btn('Give your points',"donate()",'primary')}</div><div class="panel"><div class="eyebrow">YOUR TEAMS</div><h3>Kolej Kediaman 3</h3><p class="muted">Faculty of Science · 248 students connected</p><div class="budget-line"><span>Community challenge</span><span>72 / 100 check-ins</span></div><div class="progress"><div style="width:72%"></div></div><p class="muted">Reach 100 cashless check-ins together by Sunday.</p>${btn('Manage teams',"go('Profile & teams')")}</div></div>${section('What’s happening on campus')}<div class="two-col"><div class="panel"><span class="badge">23–25 OCT · EVENT ONLY</span><h3>UM Student Makers Bazaar</h3><p class="muted">Perdanasiswa · 12 student-run stalls. Explore crafts, snacks and student ventures.</p>${btn('Explore stalls',"bazaar()",'primary')}</div><div class="panel"><span class="badge">COMPETITION</span><h3>Cashless Campus Challenge</h3><p class="muted">Check in at 3 bazaar stalls during the event to earn 150 bonus points. Your progress: 0 / 3.</p>${btn('View challenge',"bazaar()")}</div></div>`;
case'Learn & earn':return heading('A minute today. Better habits tomorrow.','60-second lessons co-created with our partner bank. Earn bonus points as you learn.')+`<div class="three-col">${[['Spot a payment scam','Verify the recipient before you pay.'],['Budget your campus week','Give every ringgit a purpose.'],['Know your DuitNow QR','Check the name. Check the amount.']].map(([n,d],i)=>`<div class="panel"><span class="badge">60 SECONDS · +50 POINTS</span><div class="reward-icon" style="margin-top:25px">${['◈','▥','⌗'][i]}</div><h3>${n}</h3><p class="muted">${d}</p>${btn(state['lesson'+i]?'Completed ✓':'Start lesson',`lesson(${i})`,'primary')}</div>`).join('')}</div>`;
case'Profile & teams':return heading('Your place in the community','Sign up with your UM email and matric number, then join your teams.')+`<div class="two-col"><form class="panel" onsubmit="event.preventDefault();saveProfile(this)"><div class="eyebrow">STUDENT IDENTIFICATION</div><h3>Your UM profile</h3><label class="field">Full name<input name="name" required value="${state.name||'Aina Nadhirah'}"></label><label class="field">UM student email<input name="email" type="email" pattern=".+@siswa\\.um\\.edu\\.my" title="Use your @siswa.um.edu.my email" required value="${state.email||'aina.demo@siswa.um.edu.my'}"></label><label class="field">Matric number<input name="matric" required value="${state.matric||'U2300123'}"></label><label class="field">Residential college<select name="college">${['Kolej Kediaman 3','Kolej Kediaman 1','Kolej Kediaman 2','Off campus'].map(v=>`<option ${state.college===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Faculty<select name="faculty">${['Faculty of Science','Faculty of Engineering','Faculty of Business and Economics','Faculty of Arts and Social Sciences'].map(v=>`<option ${state.faculty===v?'selected':''}>${v}</option>`).join('')}</select></label><button class="btn primary">Save & join teams</button></form><div><div class="panel"><span class="badge">REFERRAL PROGRAMME</span><h3>Good things are better shared.</h3><p class="muted">Invite a friend to sign up with a UM email. Both receive the configured demo bonus after a first eligible check-in; see Points & referrals for current rules.</p><div class="large-number" style="font-size:28px">AINA-UM100</div>${btn('Copy referral code',"navigator.clipboard.writeText('AINA-UM100').then(()=>toast('Referral code copied')).catch(()=>toast('Your referral code: AINA-UM100'))")}</div><div class="notice">Prototype profile: all form changes are saved only in this browser. UM email verification and bank integrations require a connected backend.</div></div></div>`;}}
function filtered(){return merchants.filter(m=>(category==='All'||m.category===category)&&(m.name+' '+m.location).toLowerCase().includes(query.toLowerCase()))}function filterMerchants(){$('#merchant-results').innerHTML=filtered().map(merchantCard).join('')||'<p class="empty">No merchants found. Try another search.</p>'}function merchantDetail(name){const m=merchants.find(x=>x.name===name);modal(`<span class="badge">✓ CASHLESS READY · MPP VERIFIED</span><h2>${m.name}</h2><p>${m.category} · ${m.location}<br>${m.distance} m away · Accepts DuitNow QR</p><img src="${photo(m)}" alt="${m.category}" style="width:100%;height:150px;object-fit:cover;border-radius:8px"><h3>${m.offer}</h3><p><b>1. Pay:</b> At the shop, use its DuitNow QR in your bank or e-wallet app. Confirm the recipient and amount.<br><b>2. Check in:</b> After payment, use the shop’s separate daily check-in code or your receipt.<br><b>3. Earn:</b> Your verified check-in adds points to your rewards balance.</p>${btn('I’ve paid — record my check-in',`close();checkin('${m.name}')`,'primary')}`)}
function checkin(name='Kopi Kolej'){modal(`<span class="eyebrow">PAY → VERIFY → EARN</span><h2>Paid cashless? Claim your points.</h2><p>First complete payment in your bank or e-wallet app. Then enter the purchase amount and daily check-in code below, or select your receipt. The payment QR and check-in code are separate.</p><form onsubmit="event.preventDefault();submitCheckin(this)"><label class="field">Merchant<select name="merchant">${merchants.map(m=>`<option ${name===m.name?'selected':''}>${m.name}</option>`).join('')}</select></label><label class="field">Purchase amount (RM)<input name="amount" type="number" min="0.5" step=".01" required placeholder="0.00"></label><label class="field">Daily check-in QR code<input name="code" placeholder="Demo code: UM2210"></label><label class="field">Or upload your receipt<input name="receipt" type="file" accept="image/*,.pdf"></label><div class="notice">Demo verification only. This UI does not process payments or validate real receipts.</div><button class="btn primary wide-btn">Submit check-in & claim points</button></form>`)}function submitCheckin(f){if(f.code.value.trim()!=='UM2210'&&!f.receipt.files.length){toast('Enter demo code UM2210 or select a receipt');return}const amount=+f.amount.value,pts=Math.floor(amount*2);state.points+=pts;state.spent+=amount;state.checkins++;state.transactions=[{name:f.merchant.value,amount,points:pts,date:'Today · just now'},...(state.transactions||[{name:'Kopi Kolej',date:'Today, 10:42 am',amount:8.5,points:17},{name:'The Daily Bowl',date:'Yesterday',amount:12,points:24}])];persist();close();render();checkinSuccess(pts)}
function donate(){modal(`<span class="eyebrow">UM STUDENT WELFARE FUND</span><h2>A little generosity goes far.</h2><p>You have ${state.points.toLocaleString()} points. Choose how many you’d like to give to the student welfare pool.</p><form onsubmit="event.preventDefault();state.points-=+this.amount.value;state.donated+=+this.amount.value;persist();close();render();toast('Your demo donation has been added to the welfare pool')"><label class="field">Points to donate<input name="amount" type="number" min="10" max="${state.points}" required value="100"></label><button class="btn primary">Donate points</button></form>`)}function redeem(n,p){if(state.redeemed.includes(n)){modal(`<span class="badge">YOUR DEMO REWARD</span><h2>${n}</h2><p>Show this code to the merchant. Valid for 30 days.</p><div class="large-number" style="font-size:28px">UM-${state.redeemed.indexOf(n)+22101}</div><div class="notice">Prototype reward · no monetary value</div>`);return}if(state.points<p){toast('You need more points for this reward');return}modal(`<h2>Redeem ${n}?</h2><p>${p} points will be deducted from your balance of ${state.points}. This is a demo redemption.</p>${btn('Confirm redemption',`state.points-=${p};state.redeemed.push('${n}');persist();close();render();toast('Reward added to your vouchers')`,'primary')}`)}function budget(){modal(`<h2>Your weekly spending goal</h2><form onsubmit="event.preventDefault();state.goal=+this.goal.value;persist();close();render();toast('Weekly goal updated')"><label class="field">Weekly budget (RM)<input name="goal" type="number" min="1" required value="${state.goal||150}"></label><button class="btn primary">Save goal</button></form>`)}function saveProfile(f){for(const [k,v]of new FormData(f))state[k]=v;persist();modal(`<span class="badge">PROFILE SAVED</span><h2>You’re connected to your teams.</h2><p>Next, find a verified campus merchant. Pay with DuitNow QR at the shop, then check in here to earn points.</p>${btn('Next: find a merchant',"close();go('Discover merchants')",'primary')}`)}
function lesson(i){const lessons=[['Spot a payment scam','A seller asks you to share your banking OTP to receive a refund. What should you do?',['Share the OTP','Refuse and contact your bank through its official channel'],1],['Budget your campus week','What is the best first step when setting a weekly budget?',['List essential costs and set a realistic limit','Spend first and check later'],0],['Know your DuitNow QR','Before confirming a QR payment, what should you check?',['Only the QR sticker colour','The recipient name and the payment amount'],1]];const l=lessons[i];modal(`<span class="eyebrow">PARTNER BANK LEARNING · 60 SECONDS</span><h2>${l[0]}</h2><p>${l[1]}</p>${l[2].map((a,j)=>btn(a,`answerLesson(${i},${j===l[3]})`,'wide-btn')).join('')}`)}function answerLesson(i,right){if(!right){toast('Try again. Keep your OTP private and verify before paying.');return}if(!state['lesson'+i]){state.points+=50;state['lesson'+i]=true;persist();toast('Correct · 50 bonus points unlocked')}else toast('Correct · you have already earned this lesson’s points');close();render()}function bazaar(){modal(`<span class="badge">23–25 OCTOBER · PERDANASISWA</span><h2>Meet your campus makers.</h2><div class="listing"><div><h3>Roti by Hana</h3><p>Student bakery · DuitNow QR ready</p></div><span>🥐</span></div><div class="listing"><div><h3>Studio Siswa</h3><p>Handmade prints · DuitNow QR ready</p></div><span>✧</span></div><p>Event-only challenge: visit 3 different stalls for 150 bonus points. Listings automatically expire after 25 October; verified QRs remain in this month’s PayNet export.</p>${btn('Check in at a stall',"close();checkin()",'primary')}`)}function notifications(){modal(`<h2>You’re in the loop.</h2><div class="listing"><div><h3>250 points expire in 12 days</h3><p>Redeem or give them a purpose before 3 November.</p></div></div><div class="listing"><div><h3>Your next campus adventure</h3><p>The Student Makers Bazaar starts tomorrow.</p></div></div>${btn('Explore rewards',"close();go('Rewards & missions')")}`)}
function merchantView(){switch(page){case'Overview':return heading('Hello, Kopi Kolej.','Submit your details → get MPP approval → prepare your staff → promote → review visits.',btn('Next: create an offer',"go('Offers & marketing')",'primary'))+`<div class="hero"><div><div class="eyebrow">YOUR CAMPUS BUSINESS, CONNECTED</div><h2>A little shop.<br>A bigger community.</h2><p>New here? Submit your business details for MPP review.<br>Already set up? Run an offer and track student visits.</p>${btn('Register / check application',"go('Business onboarding')",'gold-btn')}</div><div class="hero-art"><div class="card-label">UM CONNECT+ / MERCHANT</div><strong>Kopi Kolej</strong><span class="chip">✓</span><small>CASHLESS READY · MPP VERIFIED</small></div></div><div class="stats">${stat('Check-ins today','28','↑ 12% from yesterday','⌗')}${stat('New students','9','19 returning students','◉')}${stat('Active offers',state.offers.filter(x=>x.status==='Approved').length+1,'Offers approved by MPP','✧')}${stat('Readiness','100%','Cashless Ready badge earned','✓')}</div><div class="two-col"><div class="panel">${section('Visits this week')}<div class="bar-chart">${[35,55,43,84,62,40,20].map((v,i)=>`<div style="height:${v}%"><small>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</small></div>`).join('')}</div><div class="chart-key"><span>New and returning students</span><button class="text-btn" onclick="go('Merchant insights')">See insights ↗</button></div></div><div class="panel"><span class="badge">DAILY CHECK-IN</span><h3>Turn a payment into a connection.</h3><p class="muted">Display your payment QR and daily check-in poster together. Students pay first, then use the check-in code to claim points.</p>${btn('Display daily check-in poster',"poster()",'primary')}<p class="muted">Today’s demo code: UM2210</p></div></div>`;
case'Business onboarding':return heading('Bring your business to campus','Complete the form and upload your DuitNow QR. MPP reviews your application before approval.')+`<div class="steps"><span>01 Business details</span><span>02 DuitNow QR</span><span>03 MPP verification</span><span>04 Cashless Ready</span></div><div class="two-col"><form class="panel" onsubmit="event.preventDefault();submitBusiness(this)"><h3>Business registration</h3>${[['business','Business name','Kopi Kolej'],['account','Account / QR recipient name','Kopi Kolej Enterprise'],['location','Location','Kolej Kediaman 3'],['phone','Business phone',''],['ambassador','Ambassador referral ID (optional)','']].map(([n,l,v])=>`<label class="field">${l}<input name="${n}" ${n==='ambassador'?'':'required'} value="${state.onboarding?.[n]||v}"></label>`).join('')}<label class="field">Business type<select name="type"><option>Food & drinks</option><option>Laundry</option><option>Printing</option><option>Shops</option><option>Student event stall</option></select></label><label class="field">Business category<select name="category"><option>Campus permanent merchant</option><option>Within 100 m of UM gate</option><option>Temporary student entrepreneur</option></select></label><label class="field">DuitNow QR photo<input type="file" name="qr" accept="image/*" required></label><button class="btn primary">Submit details & QR to MPP</button></form><div><div class="panel"><h3>Onboarding with an ambassador?</h3><p class="muted">The ambassador can complete registration on the merchant’s phone. Enter their referral ID so every successful sign-up is credited to them.</p><span class="badge">${state.onboarding?(state.approved.includes(state.onboarding.business)?'MPP verified':'Awaiting MPP review'):'Not submitted · self-service or assisted'}</span></div><div class="panel"><h3>What happens next?</h3><p class="muted"><b>After submission:</b> MPP checks your account name, QR and location. Submission is not approval.<br><b>After approval:</b> Display your daily check-in poster and complete the staff guide to earn your Cashless Ready badge.</p>${btn('Prepare staff: open readiness guide',"go('Cashless readiness')")}<p class="muted">Your application status appears above.</p></div></div></div>`;
case'Cashless readiness':return heading('Ready for every cashless customer','Read the guides, confirm each staff checklist item, then continue to promotions.')+`<div class="toolbar"><select style="width:180px;margin:0" onchange="state.lang=this.value;persist();render()">${['English','Bahasa Malaysia','中文'].map(v=>`<option ${state.lang===v?'selected':''}>${v}</option>`).join('')}</select><span class="badge">${state.ready?'✓ Cashless Ready badge earned':'Complete the checklist to earn your badge'}</span></div><div class="two-col"><div class="panel"><h3>${state.lang==='中文'?'如何确认付款':state.lang==='Bahasa Malaysia'?'Cara mengesahkan bayaran':'How to verify a payment'}</h3><p class="muted">${state.lang==='中文'?'在商家银行应用中确认交易。核对收款人、金额及交易参考编号。不要只依赖顾客的截图。':state.lang==='Bahasa Malaysia'?'Semak transaksi dalam aplikasi bank peniaga. Pastikan nama penerima, jumlah dan nombor rujukan betul. Jangan bergantung pada tangkap layar pelanggan sahaja.':'Check your own banking app for the transaction. Match the recipient, amount and reference. A customer’s screenshot alone is not payment confirmation.'}</p><h3>${state.lang==='中文'?'DuitNow QR 结算':state.lang==='Bahasa Malaysia'?'Penyelesaian DuitNow QR':'How DuitNow QR settlement works'}</h3><p class="muted">${state.lang==='中文'?'款项通过您的收单机构进入关联账户。请向银行确认结算时间、费用及退款流程。':state.lang==='Bahasa Malaysia'?'Bayaran masuk ke akaun yang dipautkan melalui pemeroleh anda. Semak jadual penyelesaian, caj dan proses bayaran balik dengan bank anda.':'Payments reach your linked account through your acquirer. Confirm the settlement schedule, fees and refund process with your own bank or payment provider.'}</p></div><form class="panel" onsubmit="event.preventDefault();completeReadiness()"><h3>Staff readiness checklist</h3>${['We can verify payments in our own banking app','We can explain settlement to customers','Our DuitNow QR name matches the registered business','Our daily check-in poster is displayed'].map(n=>`<label class="field"><input type="checkbox" required ${state.ready?'checked':''}> ${n}</label>`).join('')}<button class="btn primary">Finish checklist & see next step</button></form></div>`;
case'Offers & marketing':return heading('Give students a reason to return','Create an offer → submit to MPP → wait for approval → review results in Merchant insights.')+`<div class="two-col"><form class="panel" onsubmit="event.preventDefault();submitOffer(this)"><h3>Create your next offer</h3><label class="field">Offer title<input name="title" placeholder="Double points Tuesdays" required></label><label class="field">Promotion type<select name="type"><option>Extra points on Tuesdays</option><option>First-visit bonus</option><option>Merchant voucher</option></select></label><label class="field">Offer end date<input name="date" type="date" min="2026-10-22" required></label><button class="btn primary">Send offer to MPP for approval</button></form><div class="panel"><h3>Your offers</h3><div class="listing"><div><h3>2× points on your first visit</h3><p>Active · 32 redemptions</p></div><span class="badge">Approved</span></div>${state.offers.map(o=>`<div class="listing"><div><h3>${escapeHtml(o.name)}</h3><p>Ends ${o.date}</p></div><span class="badge">${o.status}</span></div>`).join('')}</div></div>`;

case'Student bazaars':return heading('Big ideas. Student-sized businesses.','Temporary listings for student entrepreneurs, bazaars and competitions.')+`<div class="two-col"><form class="panel" onsubmit="event.preventDefault();state.stall=this.stall.value;persist();toast('Student stall submitted for MPP review')"><h3>Register an event stall</h3><label class="field">Student business name<input name="stall" required></label><label class="field">Event<select><option>UM Student Makers Bazaar · 23–25 October</option><option>Cashless Campus Competition</option></select></label><label class="field">DuitNow QR photo<input type="file" accept="image/*" required></label><button class="btn primary">Submit student stall</button></form><div class="panel"><span class="badge">TEMPORARY LISTING</span><h3>Here for the event. Counted for the month.</h3><p class="muted">Your listing expires after the event ends. Your verified QR is still included in that month’s PayNet merchant list. Students can earn event-only challenge points at participating stalls.</p>${btn('Preview student bazaar',"bazaar()")}</div></div>`;}}
function mpp(){switch(page){case'Overview':return heading('A connected campus, in view.','Manage the people, merchants and programmes behind UM Connect+.',btn('Export monthly list',"exportMerchants()",'primary'))+`<div class="stats">${stat('Verified merchants',48+state.approved.length,'Across campus and nearby gates','✓')}${stat('Awaiting verification',Math.max(0,3-state.approved.length)+(state.onboarding?1:0),'Business details and QR review','⌗','warning')}${stat('Student check-ins','2,846','↑ 18% this month','↗')}${stat('Campaign budget','RM 4,250','RM 750 committed of RM 5,000','▥')}</div><div class="two-col"><div class="panel">${section('Ready for your review',`<button class="text-btn" onclick="go('Verification queue')">Open queue ↗</button>`)}${['Roti by Hana','Fresh Laundry','Studio Siswa'].filter(n=>!state.approved.includes(n)).map(n=>`<div class="listing"><div><h3>${n}</h3><p>Business details & DuitNow QR submitted</p></div>${btn('Review',`review('${n}')`)}</div>`).join('')||'<p class="muted">All caught up. No pending merchants.</p>'}</div><div class="community-card"><span class="eyebrow">THIS MONTH’S CAMPUS IMPACT</span><h3>Small actions.<br>Shared progress.</h3><div class="large-number">12,450 <span class="muted">welfare points</span></div><p>From direct donations and expired points. Reconcile point allocations before closing the month.</p>${btn('Open reconciliation',"go('Reconciliation')")}</div></div><div class="panel">${section('Campaigns to keep an eye on')}<div class="listing"><div><h3>Cashless Campus Week</h3><p>19–25 October · 426 participants · 62% of reward budget used</p></div><span class="badge">Active</span></div><div class="listing"><div><h3>Student Makers Bazaar</h3><p>23–25 October · 12 stalls · Event listings expire automatically</p></div><span class="badge" style="background:#faf3e5;color:#a37c37">Upcoming</span></div></div>`;

function poster(){modal(`<span class="badge">KOPI KOLEJ · DAILY CHECK-IN</span><h2>Paid cashless?<br>Make it count.</h2><div style="background:#edf0f7;text-align:center;padding:30px;border-radius:8px"><span style="font-size:60px">⌗</span><h3 style="letter-spacing:5px">UM2210</h3><p>Demo check-in code · 22 October 2026</p></div><p>Production posters will contain a signed, daily QR code. This demo uses a typed code to preview the student flow.</p>${btn('Print demo poster',"window.print()",'primary')}`)}function review(n){modal(`<span class="eyebrow">MPP · MERCHANT VERIFICATION</span><h2>${escapeHtml(n)}</h2><p>Recipient: ${escapeHtml(n)} Enterprise<br>Location: Perdanasiswa / campus gate<br>Category: Campus merchant<br>Ambassador: AMB-003 (credited on approval)</p><div class="notice">Sample application. Uploaded QR and identity evidence would appear here in the connected service.</div><form onsubmit="event.preventDefault();approveMerchant(this.dataset.name)" data-name="${escapeHtml(n)}">${['Business and recipient names match','QR and location meet campus eligibility','Business details have been reviewed'].map(v=>`<label class="field"><input type="checkbox" required> ${v}</label>`).join('')}<button class="btn primary">Verify merchant & issue poster</button></form>`)}function approveMerchant(n){state.approved.push(n);persist();close();render();toast('Merchant verified · daily poster issued · ambassador credited')}function approveOffer(i){state.offers[i].status='Approved';persist();render();toast('Offer approved · now visible in the student merchant directory');merchants[0].offer=state.offers[i].name}function newCampaign(){modal(`<h2>Create a campus campaign</h2><form onsubmit="event.preventDefault();state.campaigns=[...(state.campaigns||[]),this.name.value];persist();close();render();toast('Demo campaign created')"><label class="field">Campaign name<input name="name" required></label><label class="field">Start date<input type="date" required></label><label class="field">End date<input type="date" required></label><button class="btn primary">Create campaign</button></form>`)}function reconcileReview(){modal(`<h2>Review check-in exceptions</h2><p>CHK-2041: Receipt RM 8.50; entered RM 85.00.<br>Proposed action: correct to RM 8.50.<br><br>CHK-2048: Duplicate reference matches an existing record.<br>Proposed action: exclude duplicate.</p>${btn('Accept demo corrections',"state.reconciled=true;persist();close();render();toast('Demo reconciliation exceptions resolved')",'primary')}`)}function mppBudget(){modal(`<h2>Programme allocation</h2><form onsubmit="event.preventDefault();state.mppBudget=+this.amount.value;persist();close();render();toast('Budget allocation updated')"><label class="field">Total monthly allocation (RM)<input name="amount" type="number" min="750" value="${state.mppBudget||5000}" required></label><button class="btn primary">Save allocation</button></form>`)}function download(name,rows){const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('CSV exported')};function exportMerchants(){download('UM-PayNet-October-2026.csv',[['Merchant','Account name','Category','Location','QR ID (demo)','Event expiry','Ambassador'],...merchants.map((m,i)=>[m.name,m.name+' Enterprise',m.category,m.location,'DEMO-QR-'+(i+1),'','']),...state.approved.map(n=>[n,n+' Enterprise','Student entrepreneur','Perdanasiswa','DEMO-EVENT-QR','2026-10-25','AMB-003'])])}function exportReconciliation(){download('UM-Reconciliation-October-2026.csv',[['Record','Points'],['Issued',42680],['Redeemed',18400],['Welfare',12450+state.donated],['Exceptions',state.reconciled?0:2]])}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))close()});if(state.offers.some(x=>x.status==='Approved'))merchants[0].offer=state.offers.find(x=>x.status==='Approved').name;render();

function submitOffer(form){state.offers.push({name:form.title.value,type:form.type.value,date:form.date.value,status:'Pending MPP approval'});persist();render();modal(`<span class="badge">OFFER AWAITING MPP APPROVAL</span><h2>Your offer is in review.</h2><p>It is not visible to students yet. After MPP approval, students can discover the offer. Use Merchant insights to review visits and redemptions when it runs.</p>${btn('View offer status',"close();go('Offers & marketing')",'primary')}${btn('See where results appear',"close();go('Merchant insights')")}`)}

const surveyKnowledge=[['A seller asks for your banking OTP to issue a refund. What do you do?',['Share it to receive the refund','Keep it private and contact the bank through an official channel','Not sure'],1],['Before confirming a QR payment, what should you check?',['Recipient name and amount','Only the sticker colour','Not sure'],0],['What is a useful first step in budgeting?',['Spend first and review later','List essential costs and set a realistic limit','Not sure'],1],['What confirms a payment has reached a merchant?',['A screenshot shown by the customer','The transaction in the merchant’s own banking app','Not sure'],1]];
const surveyDigital={Student:[['How comfortable are you using banking or e-wallet apps?',['I need guided help','I can complete basic payments','I use them confidently']],['How often do you use cashless payments?',['Rarely or never','Sometimes','Most days']],['Can you find and review your transaction history?',['I need help','With some effort','Independently']]],Merchant:[['What is your business’s QR readiness?',['Cash only / no QR','Personal QR / setup in progress','Business QR ready']],['Can your staff confirm payments independently?',['Not yet','Some staff can','All relevant staff can']],['Can you review settlements and transaction records?',['I need onboarding support','With some help','Independently']]]};
function readinessGrade(knowledge,digital){const score=Math.round(knowledge*.6+digital*.4);return {score,grade:score>=80?'A':score>=60?'B':score>=40?'C':'D'}}
function recommendation(role,r){const titles=role==='Student'?{A:'Confident digital participant',B:'Growing confidence',C:'Guided learner',D:'Start with the basics'}:{A:'Ready merchant',B:'Nearly ready',C:'Assisted onboarding',D:'Foundational support'};return {title:titles[r.grade],next:role==='Student'?(r.knowledge<75?'Learn & earn':'Discover merchants'):(r.digital<70?'Business onboarding':'Cashless readiness'),detail:role==='Student'?(r.knowledge<75?'Review payment safety and budgeting lessons before your next purchase.':'Explore participating merchants and put your payment knowledge into practice.'):(r.digital<70?'Arrange ambassador assistance and review your business QR setup.':'Complete the staff checklist, then create an offer for quieter hours.')}}
function surveyPage(){const role=mode,r=state.surveys[role];return heading('A quick check before we connect.','Preliminary survey · financial knowledge and digital readiness, assessed separately.')+`<div class="two-col"><form class="panel survey-form" onsubmit="event.preventDefault();submitSurvey(this)"><span class="eyebrow">${role.toUpperCase()} BASELINE · 7 QUESTIONS</span><h3>Tell us where to begin.</h3><p class="muted">Choose “Not sure” whenever useful. This short demo survey suggests support; it is not a validated financial-literacy assessment.</p>${surveyKnowledge.map(([q,answers],i)=>surveyQuestion(q,answers,'k'+i)).join('')}${surveyDigital[role].map(([q,answers],i)=>surveyQuestion(q,answers,'d'+i)).join('')}<label class="survey-consent"><input type="checkbox" required> I understand my responses are saved only in this browser for this demo.</label><button class="btn primary wide-btn">${r?'Update my baseline':'See my grade & suggested next step'}</button><p class="muted">${state.rules.surveyBonus} points for a student’s first completion only. Grades never change the reward.</p></form><div>${r?surveyResult(role,r):`<div class="community-card"><span class="eyebrow">PERSONALISED SUPPORT</span><h3>Your starting point,<br>your next opportunity.</h3><p>Financial knowledge comes from four scenario questions. Digital readiness comes from three self-reported answers.</p></div>`}<div class="panel" style="margin-top:24px"><h3>How the demo grading works</h3><p class="muted">60% financial knowledge + 40% digital readiness. A high confidence score alone cannot establish financial knowledge.</p>${[['A','80–100','Confident student / ready merchant'],['B','60–79','Targeted guidance'],['C','40–59','Assisted support'],['D','0–39','Foundational learning']].map(([g,n,t])=>`<div class="listing"><span class="grade-chip">${g}</span><div><b>${n}</b><p>${t}</p></div></div>`).join('')}<p class="muted">These are adjustable programme segments, not academic grades, eligibility decisions or MPP verification.</p></div></div></div>`}
function surveyQuestion(q,answers,name){return `<fieldset class="survey-q"><legend>${q}</legend>${answers.map((a,i)=>`<label><input type="radio" name="${name}" value="${i}" required> ${a}</label>`).join('')}</fieldset>`}
function pointEvent(amount,label){state.points+=amount;state.pointEvents.unshift({amount,label,date:new Date().toISOString()});persist()}
function submitSurvey(f){const data=new FormData(f);const answers={};for(const [k,v]of data)answers[k]=+v;const role=mode;const knowledge=surveyKnowledge.reduce((sum,q,i)=>sum+(answers['k'+i]===q[2]?25:0),0);const digital=Math.round([0,1,2].reduce((sum,i)=>sum+answers['d'+i],0)/6*100);const result={...readinessGrade(knowledge,digital),knowledge,digital,date:new Date().toISOString(),answers};state.surveys[role]=result;let bonus=0;if(role==='Student'&&!state.surveyRewarded){bonus=state.rules.surveyBonus;state.surveyRewarded=true;pointEvent(bonus,'First student baseline completed')}persist();render();modal(`<span class="badge">YOUR STARTING POINT · GRADE ${result.grade}</span><h2>${recommendation(role,result).title}</h2><p>Knowledge ${knowledge}% · Digital readiness ${digital}%. ${recommendation(role,result).detail}</p>${bonus?`<p>+${bonus} demo points · first completion</p>`:''}${btn('Continue to my suggested next step',`close();go('${recommendation(role,result).next}')`,'primary')}`)}
function surveyResult(role,r){const rec=recommendation(role,r);return `<div class="panel"><span class="badge">YOUR BASELINE · ${new Date(r.date).toLocaleDateString('en-GB')}</span><div class="result-grade">${r.grade}<span>${r.score}/100 combined</span></div><h3>${rec.title}</h3>${[['Financial knowledge',r.knowledge],['Digital readiness',r.digital]].map(([n,v])=>`<div class="budget-line"><span>${n}</span><b>${v}%</b></div><div class="progress"><div style="width:${v}%"></div></div>`).join('')}<p class="muted">${rec.detail}</p>${btn('Open suggested support',`go('${rec.next}')`)}</div>`}
function cafeData(c){return {...c,...state.cafeCounts[c.id]}}
function occupancy(c){const d=cafeData(c);return Math.round(d.occupied/d.capacity*100)}
function minutes(t){return Number(t.slice(0,2))*60+Number(t.slice(3,5))}
function campusClock(){const f=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kuala_Lumpur',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});return clockPreview||f.format(new Date())}
function campusDay(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kuala_Lumpur',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function dealStatus(d){if(!d.enabled)return 'Paused';if(d.status!=='Approved')return 'Awaiting MPP';if(state.dealUses.filter(u=>u.deal===d.id&&u.day===campusDay()).length>=d.limit)return 'Allocation used';const t=minutes(campusClock());if(t<minutes(d.start)||t>=minutes(d.end))return 'Outside offer hours';const c=cafes.find(c=>c.id===d.cafe);if(!c||occupancy(c)>=d.threshold)return 'Occupancy target met';return 'Available'}

function placePin(c){const n=campusPlaces.indexOf(c)+1;return `<div class="cafe-landmark ${c.x>60?'pop-left':''} ${c.y>55?'pop-up':''}" style="left:${c.x}%;top:${c.y}%" onmouseenter="showCafePin('${c.id}')" onmouseleave="hideCafePin('${c.id}')"><button class="landmark-button" aria-label="${escapeHtml(c.name)} café details" aria-expanded="false" aria-controls="popover-${c.id}" onfocus="showCafePin('${c.id}')" onclick="toggleCafePin('${c.id}')" onkeydown="if(event.key==='Escape'){hideCafePin('${c.id}',true);this.focus()}"><span>☕</span><b>${n}</b></button><span class="landmark-label">${escapeHtml(c.name)}</span><section id="popover-${c.id}" class="cafe-popover" aria-label="${escapeHtml(c.name)} details" onfocusout="if(!this.parentElement.contains(event.relatedTarget))hideCafePin('${c.id}',true)"><button class="popover-close" aria-label="Close café details" onclick="hideCafePin('${c.id}',true)">×</button><span class="eyebrow">${escapeHtml(c.zone)}</span><h3>${escapeHtml(c.name)}</h3>${placeFacts(c)}<a href="${c.source}" target="_blank" rel="noopener">View listing source ↗</a><small class="listing-caveat">Public listing · current operation unconfirmed</small></section></div>`}
function showCafePin(id){document.querySelectorAll('.cafe-landmark.open').forEach(e=>{if(e.querySelector('section').id!=='popover-'+id){e.classList.remove('open');e.querySelector('button').setAttribute('aria-expanded','false')}});const p=document.getElementById('popover-'+id);if(p){p.parentElement.classList.add('open');p.parentElement.querySelector('button').setAttribute('aria-expanded','true')}}

function toggleCafePin(id){const p=document.getElementById('popover-'+id).parentElement;if(p.classList.contains('pinned'))hideCafePin(id,true);else{showCafePin(id);document.querySelectorAll('.cafe-landmark.pinned').forEach(e=>e.classList.remove('pinned'));p.classList.add('pinned')}}
function campusMap(){const list=campusPlaceList();return `<div class="campus-map campus-wide"><div class="map-title"><span class="eyebrow">CAMPUS CAFÉ EXPLORER</span><h3>A place for every campus break.</h3><p>Hover, focus or tap a café pin to explore.</p></div><svg class="campus-landscape" viewBox="0 0 1000 620" preserveAspectRatio="none" aria-hidden="true"><path d="M80 80 Q400 5 800 70 Q990 180 925 480 Q800 610 200 560 Q20 490 80 80Z" fill="#e1ecdf" stroke="#b9d0b7" stroke-width="3"/><path d="M30 480 Q220 400 350 330 T890 140 M140 90 Q270 180 450 320 T900 520 M330 50 Q480 140 550 300 T650 580" stroke="#fff" stroke-width="22" fill="none"/><path d="M30 480 Q220 400 350 330 T890 140 M140 90 Q270 180 450 320 T900 520 M330 50 Q480 140 550 300 T650 580" stroke="#d3d9d0" stroke-width="2" stroke-dasharray="6 8" fill="none"/><ellipse cx="580" cy="270" rx="72" ry="35" fill="#b7dce3"/><g fill="#c5d2c2" stroke="#f8faf5" stroke-width="3"><rect x="660" y="130" width="80" height="40" rx="8"/><rect x="680" y="380" width="95" height="50" rx="8"/><rect x="130" y="200" width="75" height="40" rx="8"/><rect x="440" y="430" width="80" height="40" rx="8"/></g><g fill="#8da58c"><circle cx="360" cy="180" r="22"/><circle cx="650" cy="465" r="26"/><circle cx="110" cy="350" r="23"/></g></svg><span class="zone-label residential">RESIDENTIAL COLLEGES</span><span class="zone-label academic">FACULTIES & ACADEMIC ZONE</span><span class="zone-label central">CENTRAL CAMPUS</span><div id="campus-pins">${list.map(placePin).join('')}</div><div class="campus-map-legend"><span>☕ Publicly listed café / food court</span><span id="map-result-count">${list.length} of ${campusPlaces.length} shown</span><small>Landmark layout is schematic; use the official map for geography.</small></div></div>`}
function googleCampusOverview(){return `<section class="panel google-campus-panel"><div class="google-campus-head"><div><span class="eyebrow">EXPLORE UNIVERSITI MALAYA</span><h3>Google Maps · campus overview</h3><p class="muted">Pan and zoom to explore campus roads, buildings and nearby places.</p></div><a class="btn primary" href="https://www.google.com/maps/search/?api=1&amp;query=Universiti+Malaya+Kuala+Lumpur" target="_blank" rel="noopener">Open in Google Maps ↗</a></div><iframe class="google-campus-frame" title="Google Maps overview of Universiti Malaya campus" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3983.9039385421706!2d101.65221061525207!3d3.1201064541993873!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31cdb47024217187:0x1e85ebc65d47d641!2sUniversity-of-Malaya!5e0!3m2!1sen!2smy!4v1560931577458!5m2!1sen!2smy" width="100%" height="580" style="border:0" allowfullscreen="" referrerpolicy="no-referrer-when-downgrade"></iframe><div class="google-map-note"><span>Map provided by Google · internet connection required.</span><a href="https://www.um.edu.my/campus-map" target="_blank" rel="noopener">Embed referenced from UM’s campus map ↗</a></div><p class="muted">Use Café pin explorer for the researched café details. Custom café popovers are separate from Google’s map markers.</p></section>`}
function cafesPage(){return heading('Explore campus. Find your next favourite.','Cafés, food courts and campus dining, together in one overview.')+`<div class="campus-intro"><div><span class="eyebrow">YOUR CAMPUS FOOD GUIDE</span><h2>Good food. Better campus days.</h2><p>Explore UM on Google Maps, browse the official campus plan, or open café landmarks for food and price information.</p></div><div class="campus-total"><strong>${campusPlaces.length}</strong><span>researched listings</span></div></div><div class="map-view-tabs" role="group" aria-label="Campus map view"><button class="btn ${campusMapView==='google'?'primary':''}" onclick="campusMapView='google';render()">Google Maps overview</button><button class="btn ${campusMapView==='explorer'?'primary':''}" onclick="campusMapView='explorer';render()">Café pin explorer</button><button class="btn ${campusMapView==='official'?'primary':''}" onclick="campusMapView='official';render()">Whole UM campus map ↗</button></div><div class="toolbar"><input class="search" placeholder="Search café, food or landmark" aria-label="Search cafés" oninput="cafeSearch=this.value;updateCafeResults()" value="${escapeHtml(cafeSearch)}"><select aria-label="Campus zone" style="width:210px;margin:0" onchange="cafeZone=this.value;render()">${['All','Residential colleges','Central campus','Academic zone','Campus edge'].map(v=>`<option ${v===cafeZone?'selected':''}>${v}</option>`).join('')}</select></div>${campusMapView==='google'?googleCampusOverview():campusMapView==='official'?`<div class="panel official-campus"><h3>Whole UM campus · official reference</h3><p class="muted">UM’s published campus map. Open the original to zoom into landmarks. Interactive café pins are in the separate schematic explorer.</p><a href="https://www.um.edu.my/images/um-campus-map.jpg" target="_blank" rel="noopener"><img src="https://www.um.edu.my/images/um-campus-map.jpg" alt="Universiti Malaya full campus map. Open original map for a larger view."></a><a class="btn" href="https://www.um.edu.my/campus-map" target="_blank" rel="noopener">Open UM map source ↗</a></div>`:campusMap()}<div class="section-head" style="margin-top:30px"><h2>Explore the café directory</h2><span id="cafe-result-count" class="muted">${campusPlaceList().length} listings</span></div><div id="cafe-results" class="three-col">${campusPlaceList().map(cafeCard).join('')}</div><div class="panel directory-sources"><h3>About this directory</h3><p>Based on UM’s published F&amp;B listings and a 2023 campus guide, consulted 28 October 2026. This is an initial directory, not a complete or current census. Some source rental periods have ended; contact the venue before visiting. Menu prices, operating hours, dietary certification and live occupancy are not verified.</p><a href="${campusSource}" target="_blank" rel="noopener">UM food &amp; vendor listings ↗</a> · <a href="${campusGuide}" target="_blank" rel="noopener">Campus food guide (2023) ↗</a></div>`}
function updateCafeResults(){const list=campusPlaceList();$('#cafe-results').innerHTML=list.map(cafeCard).join('')||'<p class="empty">No cafés match. Try another food, landmark or zone.</p>';const pins=document.getElementById('campus-pins');if(pins)pins.innerHTML=list.map(placePin).join('');const count=document.getElementById('map-result-count');if(count)count.textContent=list.length+' of '+campusPlaces.length+' shown';document.getElementById('cafe-result-count').textContent=list.length+' listings'}
function cafeCard(c){return `<article class="panel campus-directory-card"><div class="directory-card-icon">☕ <span>${String(campusPlaces.indexOf(c)+1).padStart(2,'0')}</span></div><span class="eyebrow">${escapeHtml(c.zone)}</span><h3>${escapeHtml(c.name)}</h3><p class="muted">${escapeHtml(c.location)}</p>${placeFacts(c)}<a class="btn" href="${c.source}" target="_blank" rel="noopener">View public listing ↗</a></article>`}
function cafeDetail(c){return ''}
function dealsPage(){return heading(mode==='Merchant'?'Make quieter hours work harder.':'Good deals. A quieter café.','Off-peak offers activate within their time window and below a target occupancy.')+`<div class="toolbar"><span class="badge">${clockPreview?'SIMULATED TIME':'CURRENT MYT'} · ${campusClock()}</span>${btn(clockPreview?'Use actual time':'Preview 15:00 off-peak',clockPreview?'clockPreview=null;render()':"clockPreview='15:00';render()")}${btn('Refresh availability','render()')}</div><div class="notice">Demo availability uses sample/manual seat counts and the selected MYT time. Claiming an offer does not reserve a table or apply a real discount. MPP approval is required for new offers.</div>${mode==='Merchant'?merchantDealTools():''}${state.claim?`<div class="next-prompt"><div><b>Your claimed offer</b><p>${escapeHtml(state.claim.title)} · ${Date.now()<state.claim.expires?'valid for '+Math.ceil((state.claim.expires-Date.now())/60000)+' more minutes':'expired — claim again if still available'}</p></div>${btn('Pay first, then check in',"checkin(state.claim.merchant)",'primary')}</div>`:''}<div class="three-col" style="margin-top:24px">${state.liveDeals.map(dealCard).join('')}</div>`}
function dealCard(d){const c=cafes.find(c=>c.id===d.cafe),status=dealStatus(d),used=state.dealUses.some(u=>u.deal===d.id&&u.day===campusDay());return `<div class="panel deal-card"><span class="badge ${status==='Available'?'':'badge-neutral'}">${status==='Available'?'● Available in demo':status}</span><h3>${escapeHtml(d.title)}</h3><p class="muted">${escapeHtml(c.name)} · ${c.zone}</p><div class="large-number">+${d.bonus}<span class="muted"> bonus points</span></div><p class="muted">Daily ${d.start}–${d.end} MYT<br>Minimum purchase RM ${d.minSpend.toFixed(2)}<br>Activates below ${d.threshold}% occupancy · currently ${occupancy(c)}%<br>${Math.max(0,d.limit-state.dealUses.filter(u=>u.deal===d.id&&u.day===campusDay()).length)} demo redemptions left today</p>${mode==='Student'?`<button class="btn primary wide-btn" ${status!=='Available'||used?'disabled':''} onclick="claimDeal('${d.id}')">${used?'Used today':status==='Available'?'Claim for 20 minutes':'Not available now'}</button>`:btn(d.enabled?'Pause offer':'Resume offer',`toggleDeal('${d.id}')`)}<p class="muted">${mode==='Student'?'Pay externally, then check in at the same café. One bonus per offer per day.':'Offers are rechecked at claim and check-in. Pausing stops new use.'}</p></div>`}
function claimDeal(id){const d=state.liveDeals.find(x=>x.id===id),c=cafes.find(c=>c.id===d.cafe);if(dealStatus(d)!=='Available'||state.dealUses.some(u=>u.deal===id&&u.day===campusDay()))return toast('This offer is no longer available');if(!c.merchant)return toast('This concept café is not connected to demo check-ins yet');state.claim={id,title:d.title,merchant:c.merchant,expires:Date.now()+20*60000};persist();render();modal(`<span class="badge">DEMO OFFER CLAIMED</span><h2>${escapeHtml(d.title)}</h2><p>Pay at ${escapeHtml(c.name)} through your banking app, then check in here within 20 minutes. Spend at least RM ${d.minSpend.toFixed(2)} to earn ${d.bonus} additional points while the offer remains available.</p><p>No table is reserved. Eligibility is checked again at check-in.</p>${btn('I have paid — check in',`close();checkin('${c.merchant}')`,'primary')}`)}
function merchantDealTools(){return `<div class="two-col" style="margin-top:24px"><form class="panel" onsubmit="event.preventDefault();updateOccupancy(this)"><h3>Update your café’s seat count</h3><label class="field">Café<select name="cafe">${cafes.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></label><label class="field">Total seats<input name="capacity" type="number" min="1" max="1000" required value="40"></label><label class="field">Occupied seats<input name="occupied" type="number" min="0" max="1000" required value="12"></label><button class="btn primary">Update demo occupancy</button><p class="muted">Demo workspace can edit any café. Production must restrict this to the café owner. Counts change only when manually submitted.</p></form><form class="panel" onsubmit="event.preventDefault();createLiveDeal(this)"><h3>Create an off-peak offer</h3><label class="field">Café<select name="cafe"><option value="kopi">Kopi Kolej</option><option value="bowl">The Daily Bowl</option></select></label><label class="field">Offer title<input name="title" required maxlength="80" placeholder="Afternoon study break"></label><div class="two-col"><label class="field">Start (MYT)<input name="start" type="time" required value="14:00"></label><label class="field">End (MYT)<input name="end" type="time" required value="17:00"></label></div><label class="field">Activate below occupancy (%)<input name="threshold" type="number" min="1" max="100" required value="60"></label><label class="field">Bonus points<input name="bonus" type="number" min="1" max="500" required value="40"></label><label class="field">Minimum purchase (RM)<input name="minSpend" type="number" min="0.5" step=".01" required value="5"></label><label class="field">Daily redemption limit<input name="limit" type="number" min="1" max="100" required value="12"></label><button class="btn primary">Send off-peak offer to MPP</button></form></div>`}
function updateOccupancy(f){const cap=+f.capacity.value,count=+f.occupied.value;if(!Number.isInteger(cap)||!Number.isInteger(count)||cap<1||count<0||count>cap)return toast('Occupied seats must be between zero and total seats');state.cafeCounts[f.cafe.value]={capacity:cap,occupied:count,updated:new Date().toISOString()};persist();render();toast('Manual demo occupancy updated')}
function createLiveDeal(f){if(minutes(f.end.value)<=minutes(f.start.value))return toast('End time must be after start time on the same day');state.liveDeals.push({id:'deal-'+Date.now(),cafe:f.cafe.value,title:f.title.value.trim(),start:f.start.value,end:f.end.value,threshold:+f.threshold.value,bonus:+f.bonus.value,minSpend:+f.minSpend.value,limit:+f.limit.value,status:'Pending',enabled:true});persist();render();toast('Off-peak offer is awaiting MPP approval')}
function toggleDeal(id){const d=state.liveDeals.find(x=>x.id===id);d.enabled=!d.enabled;persist();render()}
function pointsPage(){const r=state.rules;return heading('Know what every point means.','Adjustable demo rules · points have no cash value until a funded programme is agreed.')+`<div class="stats">${stat('Your demo balance',state.points.toLocaleString(),'Use Rewards & missions to redeem','✧')}${stat('Base earning rate',r.baseRate+' / RM1','Rounded down per recorded purchase','↗')}${stat('Successful referral','+'+r.referrerBonus,'After an eligible first check-in','◉')}${stat('First baseline survey','+'+r.surveyBonus,'Once per student, regardless of grade','▤')}</div><div class="two-col"><div class="panel"><h3>How to earn</h3><div class="listing"><div><h3>Recorded cashless purchase</h3><p>floor(amount × ${r.baseRate}). RM10.50 earns ${Math.floor(10.5*r.baseRate)} points.</p></div><b>${r.baseRate}/RM</b></div><div class="listing"><div><h3>Complete the student baseline</h3><p>First completion only; retaking does not award more points.</p></div><b>+${r.surveyBonus}</b></div><div class="listing"><div><h3>Invite a friend</h3><p>Both receive their respective bonus after the first eligible check-in. ${r.referralCap} rewards per referrer per month.</p></div><b>+${r.referrerBonus}</b></div><div class="listing"><div><h3>Off-peak café offer</h3><p>Claim first; meet café, spend, time, occupancy and daily-limit conditions.</p></div><b>Per offer</b></div><div class="listing"><div><h3>Learning lesson</h3><p>Correct answer, once per lesson. Existing demo rule.</p></div><b>+50</b></div><p class="muted">Weekly missions and first-visit campaign bonuses remain illustrative unless explicitly shown as calculated.</p></div><div class="panel"><h3>Your referrals</h3><div class="referral-code">${referralCode()}</div><p class="muted">Invite → friend enters your code → first eligible check-in → both earn points. Own codes and repeated friend IDs are rejected in this browser demo.</p>${btn('Copy my code',"copyReferral()",'primary')}${btn('Preview a referral',"referralDemo()")}${state.referrals.map(x=>`<div class="listing"><div><h3>${escapeHtml(x.friend)}</h3><p>${x.qualified?'Qualified demo first check-in':'Waiting for first check-in'} · ${x.month}</p></div>${x.qualified?'<span class="badge">Rewarded</span>':btn('Simulate first check-in',`qualifyReferral('${x.id}')`)}</div>`).join('')||'<p class="muted">No demo invites yet.</p>'}<p class="muted">No invitations are sent. The friend reward is recorded as an illustrative entitlement, not deposited into another user’s account.</p></div></div><div class="panel"><h3>Apply an inviter’s code</h3><form class="inline-form" onsubmit="event.preventDefault();applyReferral(this.code.value)"><input class="search" name="code" required maxlength="30" placeholder="e.g. FRIEND-UM100" aria-label="Inviter referral code"><button class="btn">Save code for my first check-in</button></form><p class="muted">${state.inviter?'Saved code: '+escapeHtml(state.inviter)+(state.inviterRewarded?' · bonus already awarded':' · waiting for your first new demo check-in'):'Accepts a demo code once before your first new check-in. No code owner is validated against a server.'}</p></div><div class="panel"><h3>New points activity</h3><p class="muted">Tracks earning events from this update; older rewards, donations and redemption history remain on their original screens. This is not a complete financial ledger.</p>${state.pointEvents.slice(0,15).map(x=>`<div class="listing"><div><h3>${escapeHtml(x.label)}</h3><p>${new Date(x.date).toLocaleString('en-GB')}</p></div><b>+${x.amount}</b></div>`).join('')||'<p class="muted">New earning events will appear here.</p>'}</div>`}
function referralCode(){return 'AINA-UM100'}
function copyReferral(){navigator.clipboard.writeText(referralCode()).then(()=>toast('Referral code copied')).catch(()=>toast('Your demo code: '+referralCode()))}
function referralDemo(){modal(`<span class="eyebrow">BROWSER-LOCAL REFERRAL SIMULATION</span><h2>Preview an invitation.</h2><p>Use a fictional friend ID. No email or invitation will be sent. Rewards stay pending until you simulate that friend’s first eligible check-in.</p><form onsubmit="event.preventDefault();createReferral(this.friend.value)"><label class="field">Fictional friend ID<input name="friend" required pattern="[A-Za-z0-9-]{3,24}" placeholder="demo-friend-01"></label><button class="btn primary">Create pending demo referral</button></form>`)}
function createReferral(friend){friend=friend.trim().toLowerCase();if(friend==='aina'||state.referrals.some(x=>x.friend===friend))return toast('Use a new fictional friend ID');state.referrals.push({id:'r-'+Date.now(),friend,month:campusDay().slice(0,7),qualified:false});persist();close();render()}
function qualifyReferral(id){const x=state.referrals.find(x=>x.id===id),month=campusDay().slice(0,7);if(!x||x.qualified)return toast('This referral has already been rewarded');if(state.referrals.filter(r=>r.qualified&&r.month===month).length>=state.rules.referralCap)return toast('Monthly demo referral reward cap reached');x.qualified=true;x.month=month;x.friendPoints=state.rules.friendBonus;pointEvent(state.rules.referrerBonus,'Qualified demo referral: '+x.friend);persist();render();toast('Referrer rewarded; friend entitlement recorded for demo only')}
function applyReferral(code){code=code.trim().toUpperCase();if(code===referralCode()||!/^[A-Z0-9-]{3,30}$/.test(code))return toast('Enter another valid demo referral code');if(state.inviter||state.newCheckins)return toast('Referral code can only be set once before your first new check-in');state.inviter=code;persist();render();toast('Demo inviter code saved; first check-in unlocks the bonus')}
function insightsPage(){const records=Object.entries(state.surveys);return heading('Know where support is needed.','Baseline segments, café utilisation and off-peak campaigns — current browser only.',btn('Export demo survey results','exportSurveys()'))+`<div class="notice">Only ${records.length} saved respondent profiles (one per role) are available in this browser. This is not a campus-wide survey sample. Grading is a preliminary demo rubric, not a validated instrument.</div><div class="stats" style="margin-top:20px">${['A','B','C','D'].map(g=>stat('Grade '+g,records.filter(([,r])=>r.grade===g).length,'Saved profiles in this browser','▥')).join('')}</div><div class="panel"><h3>Readiness and literacy segments</h3>${records.map(([role,r])=>`<div class="listing"><span class="grade-chip">${r.grade}</span><div><h3>${role} · ${recommendation(role,r).title}</h3><p>Financial knowledge ${r.knowledge}% · Digital readiness ${r.digital}% · Combined ${r.score}%</p><p>${recommendation(role,r).detail}</p></div></div>`).join('')||'<p class="muted">Complete a Student or Merchant baseline survey to see the result here.</p>'}</div><div class="panel"><h3>Off-peak offers awaiting approval</h3>${state.liveDeals.filter(d=>d.status!=='Approved').map(d=>`<div class="listing"><div><h3>${escapeHtml(d.title)}</h3><p>${cafes.find(c=>c.id===d.cafe).name} · ${d.start}–${d.end} · +${d.bonus} points · ${d.limit} claims/day</p></div>${btn('Approve demo offer',`approveLiveDeal('${d.id}')`,'primary')}</div>`).join('')||'<p class="muted">No pending offers. Create one in Merchant → Live deals.</p>'}</div><div class="panel"><h3>Café utilisation snapshots</h3><p class="muted">A snapshot cannot establish occupancy uplift. A live pilot needs comparable before/after periods and a shared source of verified visits.</p>${cafes.map(c=>`<div class="budget-line"><span>${c.name}</span><b>${occupancy(c)}% · ${cafeData(c).occupied}/${cafeData(c).capacity}</b></div><div class="progress"><div style="width:${occupancy(c)}%"></div></div>`).join('')}</div><div class="two-col"><div class="panel"><h3>Off-peak reward use</h3><div class="large-number">${state.dealUses.length}</div><p class="muted">Eligible demo check-ins rewarded across all saved days.</p></div><div class="panel"><h3>What Grade A means</h3><p class="muted">A combined score of 80 or above indicates a confident student or ready merchant in this demo. A merchant’s grade does not replace MPP QR/business verification.</p></div></div>`}
function approveLiveDeal(id){state.liveDeals.find(d=>d.id===id).status='Approved';persist();render();toast('Off-peak offer approved; availability depends on time and occupancy')}
function exportSurveys(){download('UM-preliminary-survey-demo.csv',[['Role','Grade','Knowledge score','Digital score','Combined score','Completed','Scope'],...Object.entries(state.surveys).map(([role,r])=>[role,r.grade,r.knowledge,r.digital,r.score,r.date,'Browser-local demo profile'])])}
function ruleSettings(){return heading('A point system you can tune.','Demo configuration applies to future earning events; historical awards stay unchanged.')+`<div class="two-col"><form class="panel" onsubmit="event.preventDefault();saveRules(this)"><h3>Programme earning rules</h3>${[['baseRate','Base points per RM1',1,10],['surveyBonus','First student survey reward',0,500],['referrerBonus','Referrer bonus',0,1000],['friendBonus','Invited friend bonus',0,1000],['referralCap','Monthly rewarded referral cap',1,50]].map(([key,label,min,max])=>`<label class="field">${label}<input name="${key}" type="number" min="${min}" max="${max}" step="1" required value="${state.rules[key]}"></label>`).join('')}<button class="btn primary">Save demo rules</button></form><div class="panel"><h3>Clear programme boundaries</h3><p class="muted">Off-peak bonuses and daily limits are set per offer by merchants and approved by MPP. Rewards are simulated and not cash payouts.</p><p class="muted">Referral caps use the Malaysia calendar month. Student survey completion is rewarded once, independently of the grade. Base earning uses the whole-number floor of purchase amount × rate.</p><p class="muted">A production programme needs funded reward liabilities, anti-abuse controls, verified participants and a shared ledger before these rates can be offered as real benefits.</p>${btn('View survey & café insights',"go('Survey & café insights')")}</div></div>`}
function saveRules(f){for(const key of ['baseRate','surveyBonus','referrerBonus','friendBonus','referralCap']){const v=+f.elements.namedItem(key).value;if(!Number.isInteger(v)||v<0)return toast('Use valid whole-number rates');state.rules[key]=v}persist();render();toast('Rules updated for future events')}
menus.Student.splice(1,0,['Baseline survey','▤'],['Campus cafés','☕'],['Live deals','✧']);menus.Student.push(['Points & referrals','↗']);
menus.Merchant.splice(1,0,['Baseline survey','▤'],['Campus cafés','☕'],['Live deals','✧']);
menus.MPP.splice(1,0,['Survey & café insights','▥'],['Points configuration','✧']);

let overviewSearch='';
function overviewCafeResults(){const list=campusPlaces.filter(c=>(c.name+' '+c.food+' '+c.location).toLowerCase().includes(overviewSearch.toLowerCase()));return list.map(c=>`<article class="overview-cafe"><div><span class="eyebrow">${escapeHtml(c.zone)}</span><h3>${escapeHtml(c.name)}</h3><p>${escapeHtml(c.location)}</p><p class="overview-food">${escapeHtml(c.food)}</p></div><button class="btn" onclick="overviewCafeDetails('${c.id}')">Café details ↗</button></article>`).join('')||'<p class="empty">No matching cafés. Try a food or campus landmark.</p>'}
function updateOverviewCafes(){document.getElementById('overview-cafe-results').innerHTML=overviewCafeResults()}
function overviewCafeDetails(id){const c=campusPlaces.find(c=>c.id===id);modal(`<span class="eyebrow">CAMPUS CAFÉ DIRECTORY</span><h2>${escapeHtml(c.name)}</h2>${placeFacts(c)}<p class="muted">Public listing; current operation unconfirmed. Prices and hours need confirmation with the venue.</p><a class="btn primary" href="https://www.google.com/maps/search/?api=1&amp;query=${encodeURIComponent(c.name+' '+c.location+' Universiti Malaya Kuala Lumpur')}" target="_blank" rel="noopener">Find in Google Maps ↗</a><p><a href="${c.source}" target="_blank" rel="noopener">View listing source ↗</a></p>`)}
function mapBasedOverview(){const studentMode=mode==='Student',r=state.surveys[mode];return heading(studentMode?'Your campus, on the map.':'Your business, connected to campus.',studentMode?'Explore UM, find a café and plan your next cashless visit.':'Explore the campus dining network and manage your participation.',studentMode?btn('Already paid? Check in',"checkin()",'primary'):btn('Manage my business',"go('Business onboarding')",'primary'))+`<div class="overview-summary"><div><strong>${campusPlaces.length}</strong><span>public dining listings</span></div>${studentMode?`<div><strong>${state.points.toLocaleString()}</strong><span>demo points</span></div><div><strong>${state.checkins}</strong><span>recorded check-ins</span></div>`:`<div><strong>${state.offers.length}</strong><span>submitted demo offers</span></div><div><strong>${state.ready?'Complete':'Get ready'}</strong><span>staff readiness checklist</span></div>`}<div class="overview-baseline"><span>${r?'Baseline · Grade '+r.grade:'Know your starting point'}</span>${btn(r?'View baseline':'Take baseline survey',"go('Baseline survey')")}</div></div><div class="overview-map-grid"><div class="overview-main-map">${googleCampusOverview()}<div class="overview-actions">${studentMode?btn('Find off-peak deals',"go('Live deals')",'gold-btn')+btn('Rewards & missions',"go('Rewards & missions')")+btn('Points & referrals',"go('Points & referrals')")+btn('Learn & earn',"go('Learn & earn')"):btn('Create an off-peak offer',"go('Live deals')",'gold-btn')+btn('Staff readiness',"go('Cashless readiness')")+btn('Offers & marketing',"go('Offers & marketing')")+btn('Merchant insights',"go('Merchant insights')")}</div></div><aside class="overview-directory"><div class="overview-directory-heading"><span class="eyebrow">FIND YOUR CAMPUS FAVOURITE</span><h2>Cafés & food courts</h2><input class="search" aria-label="Search overview café directory" placeholder="Search café, food or landmark" value="${escapeHtml(overviewSearch)}" oninput="overviewSearch=this.value;updateOverviewCafes()"></div><div id="overview-cafe-results">${overviewCafeResults()}</div><button class="text-btn" onclick="go('Campus cafés')">Full directory & campus plans ↗</button></aside></div><p class="muted overview-scope">Google Maps supplies the geographic overview and its own place markers. Café detail cards are opened from the directory. Listings are sourced publicly; live occupancy, current menus and prices are not verified.</p>`}

const originalStudent=student,originalMerchant=merchantView,originalMpp=mpp;
student=function(){if(page==='Overview')return mapBasedOverview();if(page==='Baseline survey')return surveyPage();if(page==='Campus cafés')return cafesPage();if(page==='Live deals')return dealsPage();if(page==='Points & referrals')return pointsPage();return originalStudent()};
merchantView=function(){if(page==='Overview')return mapBasedOverview();if(page==='Baseline survey')return surveyPage();if(page==='Campus cafés')return cafesPage();if(page==='Live deals')return dealsPage();return originalMerchant()};
mpp=function(){if(page==='Survey & café insights')return insightsPage();if(page==='Points configuration')return ruleSettings();return originalMpp()};
const originalRender=render;
render=function(){originalRender();if(page==='Overview'&&mode==='MPP'){const r=state.surveys[mode];const prompt=mode==='MPP'?`<div class="next-prompt"><div><b>From baseline to better participation.</b><p>Review survey segments and café utilisation, then approve targeted off-peak offers.</p></div>${btn('Open campus insights',"go('Survey & café insights')",'primary')}</div>`:`<div class="next-prompt"><div><span class="eyebrow">${r?'YOUR BASELINE · GRADE '+r.grade:'START WITH A QUICK BASELINE'}</span><p>${r?recommendation(mode,r).detail:'Find your financial knowledge and digital readiness starting point.'}</p></div>${btn(r?'View my baseline':'Take the preliminary survey',"go('Baseline survey')",'primary')}</div><div class="discovery-links">${btn('☕ Campus café overview',"go('Campus cafés')")}${btn('✧ Off-peak deals',"go('Live deals')")}${mode==='Student'?btn('↗ Points & referrals',"go('Points & referrals')"):''}</div>`;$('#main').innerHTML=prompt+$('#main').innerHTML;}if(mode==='Student'&&['Rewards & missions','Profile & teams'].includes(page))$('#main').innerHTML=`<div class="next-prompt"><div><b>One clear earning and referral scheme.</b><p>See current demo rates, referral progress and new earning events.</p></div>${btn('Points & referrals',"go('Points & referrals')")}</div>`+$('#main').innerHTML;};
// Base purchases, invited-friend bonuses and off-peak bonuses are committed together locally.
submitCheckin=function(f){if(f.code.value.trim()!=='UM2210'&&!f.receipt.files.length)return toast('Enter demo code UM2210 or select a receipt');const amount=Number(f.amount.value);if(!Number.isFinite(amount)||amount<.5||amount>100000)return toast('Enter a valid purchase amount between RM0.50 and RM100,000');const merchant=f.merchant.value;let points=Math.floor(amount*state.rules.baseRate),extras=[];if(!state.newCheckins&&state.inviter&&!state.inviterRewarded){state.inviterRewarded=true;points+=state.rules.friendBonus;extras.push('invited-friend bonus +'+state.rules.friendBonus)}const claim=state.claim;if(claim){const d=state.liveDeals.find(x=>x.id===claim.id);if(d&&claim.merchant===merchant&&Date.now()<claim.expires&&amount>=d.minSpend&&dealStatus(d)==='Available'&&!state.dealUses.some(u=>u.deal===d.id&&u.day===campusDay())){points+=d.bonus;extras.push('off-peak bonus +'+d.bonus);state.dealUses.push({deal:d.id,day:campusDay(),amount,bonus:d.bonus});state.claim=null;}}state.newCheckins=(state.newCheckins||0)+1;state.checkins++;state.spent+=amount;state.transactions=[{name:merchant,amount,points,date:'Today · just now'},...(state.transactions||[{name:'Kopi Kolej',date:'Sample previous check-in',amount:8.5,points:17}])];pointEvent(points,'Check-in at '+merchant+(extras.length?' · '+extras.join(' · '):''));persist();close();render();checkinSuccess(points)};
render();
</script></body></html>
